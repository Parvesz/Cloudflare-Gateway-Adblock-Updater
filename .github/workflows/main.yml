name: Delete Gateway Lists by Prefix

on:
  workflow_dispatch:
    inputs:
      list_prefix:
        description: 'Delete lists whose names start with this (e.g. "CGPS List - Chunk")'
        required: true
        type: string
      dry_run:
        description: 'Only preview, do not delete'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: pip install requests
      - name: Delete lists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREFIX: ${{ inputs.list_prefix }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python - <<'EOF'
          import os, requests
          acc = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          h = {"Authorization": f"Bearer {os.environ['CLOUDFLARE_API_TOKEN']}"}
          base = f"https://api.cloudflare.com/client/v4/accounts/{acc}/gateway/lists"
          prefix = os.environ["PREFIX"]
          dry = os.environ["DRY_RUN"] == "true"

          lists, page = [], 1
          while True:
              r = requests.get(base, headers=h, params={"page": page, "per_page": 100}).json()
              items = r.get("result") or []
              lists += items
              if len(items) < 100:
                  break
              page += 1

          targets = [l for l in lists if l["name"].startswith(prefix)]
          print(f"Total lists: {len(lists)} | Matching '{prefix}': {len(targets)}")
          for l in targets:
              if dry:
                  print("WOULD DELETE:", l["name"])
              else:
                  r = requests.delete(f"{base}/{l['id']}", headers=h)
                  print(("Deleted: " if r.ok else f"FAILED ({r.status_code}): ") + l["name"])
          EOF
